<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Enhancer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="main-container">
        <h1>AI Prompt Enhancer</h1>
        <p>Enter a simple idea, and we'll make it extraordinary before creating an image.</p>
        
        <div id="input-area">
            <input type="text" id="user-prompt" placeholder="e.g., a happy dog">
            <button id="generate-btn">Generate</button>
        </div>

        <div id="loader" class="hidden">
            <div class="spinner"></div>
            <p>Enhancing prompt & creating image...</p>
        </div>

        <div id="results" class="hidden">
            <div class="prompt-display">
                <h3>Your Prompt:</h3>
                <p id="original-prompt-text"></p>
            </div>
            <div class="prompt-display concept-display hidden">
                <h3>AI Added Concept:</h3>
                <p id="added-concept-text"></p>
            </div>
            <div class="prompt-display">
                <h3>AI Enhanced Prompt:</h3>
                <p id="enhanced-prompt-text"></p>
            </div>
            <div id="image-container">
                <img id="result-image" src="" alt="Generated by AI">
            </div>
        </div>
    </div>

    <script type="importmap">
    {
      "imports": {
        "canvas-confetti": "https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.module.mjs"
      }
    }
    </script>
    <script src="script.js" type="module"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
